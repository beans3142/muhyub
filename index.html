<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
// /muhyub 처럼 끝에 /가 없으면 data/·engine/ 상대 경로가 사이트 뿌리로 잡힌다. /muhyub/ 로 옮긴다
if (!location.pathname.endsWith('/') && !/\.[a-z]+$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강호 천만 분의 일 · 단 한 번의 무림 일생</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ead6;--paper2:#e8dcc0;--card:#fbf6ea;--ink:#1d1812;--ink2:#5a4f40;--ink3:#8b7e69;--line:#d8c8a4;--red:#a3261b;--red2:#c8473a;--jade:#2f6b57;--gold:#a07a1c;--blue:#33577a;--band:#5a4f40}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Serif KR",serif;font-size:16px;line-height:1.7;background:var(--paper);transition:background .8s}
/* 경지가 오를수록 배경이 바뀐다(10단계 9-11) */
body.t1{background:linear-gradient(180deg,#efe5cf 0%,#e9dfc7 60%,#ddd0b2 100%)}
body.t1::before,body.t2::before,body.t3::before{content:"";position:fixed;inset:auto 0 0 0;height:46vh;z-index:-1;pointer-events:none;background-repeat:repeat-x;background-position:bottom;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='300' viewBox='0 0 900 300'><path d='M0 300 L0 210 Q60 150 120 190 T240 150 Q300 80 360 140 T480 120 Q540 60 600 130 T720 110 Q800 70 900 150 L900 300 Z' fill='%23a89a7c' opacity='.35'/><path d='M0 300 L0 240 Q90 200 180 230 T360 210 Q450 170 540 220 T720 200 Q810 180 900 230 L900 300 Z' fill='%23857659' opacity='.35'/></svg>")}
body.t2{background:linear-gradient(180deg,#e4dbc6 0%,#d6cbb1 100%)}
body.t2::before{opacity:.8}
body.t3{background:radial-gradient(circle at 70% 0%,#f6e7b8 0%,#e9d79f 35%,#d9c487 100%)}
body.t3::before{opacity:.6;filter:sepia(1) saturate(2)}
button,select{font-family:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 80px}
.hidden{display:none!important}
.muted{color:var(--ink3);font-size:14px}
.btn{background:var(--ink);color:var(--paper);border:0;padding:11px 26px;font-size:17px;font-weight:700;letter-spacing:.08em}
.btn:hover{background:var(--red)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.sm{padding:4px 12px;font-size:14px;letter-spacing:0;font-weight:600}
.btn.on{background:var(--ink);color:var(--paper)}
.box{background:var(--card);border:1px solid var(--line);padding:14px 16px}
h1{font-weight:900;font-size:clamp(32px,5vw,54px);margin:0;letter-spacing:.04em}
h1 small{display:block;font-size:15px;font-weight:400;color:var(--ink2);letter-spacing:.3em}
h2{font-size:19px;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
h3{font-size:14px;margin:0 0 8px;color:var(--ink2);font-weight:700;letter-spacing:.08em}
.seal{display:inline-block;border:2px solid var(--red);color:var(--red);padding:1px 8px;font-weight:900;transform:rotate(-4deg);font-size:13px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.unl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line)}
.unl.locked{color:var(--ink3)}
.unl b{font-weight:700}
.sw{position:relative;width:42px;height:22px;background:#cbbd9c;border-radius:11px;flex:none;transition:.2s;cursor:pointer}
.sw.on{background:var(--jade)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:23px}
.unl select{max-width:200px;padding:3px;border:1px solid var(--line);background:var(--paper)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:13px;padding:1px 8px;border:1px solid var(--line);background:var(--card)}
.tag.off{color:var(--ink3);border-style:dashed}
.tag.new{border-color:var(--gold);color:var(--gold);font-weight:700}
.gt{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;font-weight:900;color:#fff;margin-right:6px;font-size:13px}
.g神{background:#5b2a86}.g天{background:var(--red)}.g地{background:var(--gold)}.g玄{background:var(--blue)}.g黃{background:#9b8b6b}
.chron{max-height:420px;overflow:auto}
.chron div{padding:7px 0;border-bottom:1px dotted var(--line);font-size:15px}
.chron .yr{display:inline-block;min-width:120px;color:var(--ink2);font-size:13.5px}
/* 왼쪽 사이드바: 초상·상태·조작·탭을 한곳에(사용자 요청 2026-11-25) */
.life{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
.sb{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--band);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sbtop{display:block;padding:0 0 8px}
.sb .pt{width:100%;height:360px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 75%,#fffaf0 0%,#efe3c6 60%,#e2d3ae 100%);border-bottom:1px solid var(--line);overflow:hidden}
.sb .pt img{height:350px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.sb .who{padding:10px 14px 0}
.hn{font-size:28px;font-weight:900;line-height:1.2;word-break:keep-all}
.hn .ep{display:inline-block;background:var(--red);color:#fff;font-size:14px;padding:1px 8px;margin:4px 0 0;font-weight:700}
.hsub{color:var(--ink2);font-size:14px;margin:6px 0}
h3.sec{margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
h3.sec:first-child{border-top:0;padding-top:0;margin-top:4px}
.nameIn{display:flex;gap:8px;margin:10px 0}.nameIn input{flex:1;padding:8px;border:1px solid var(--line);font:inherit;background:#fffdf7}
.hsub.birth{font-size:13px;line-height:1.5;margin-top:-2px}
.hchips{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px}
.hc{background:var(--paper);border:1px solid var(--line);padding:2px 9px;font-size:14px}
.hc b{font-weight:700}
.hc.realm{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.hc.warn{border-color:var(--red2);color:var(--red)}
.items{display:flex;gap:6px;flex-wrap:wrap}
.it{width:30px;height:30px;border:2px solid var(--red);color:var(--red);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px;background:#fff8ee;transform:rotate(-3deg)}
.it.g{border-color:var(--gold);color:var(--gold)}
.it.j{border-color:var(--jade);color:var(--jade)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;border-top:1px dotted var(--line);border-bottom:1px dotted var(--line)}
.ctrl select{padding:3px 5px;border:1px solid var(--ink);background:var(--card);font-size:14px}
.sb .tabs{padding:0 6px;margin-top:6px}
.sb .tabbody{border:0;border-top:0;background:transparent}
main{min-width:0}
@media(max-width:1100px){.life{grid-template-columns:340px minmax(0,1fr)}.sb .pt{height:300px}.sb .pt img{height:290px}.hn{font-size:24px}}
@media(max-width:760px){.sb .pt{height:260px}.sb .pt img{height:250px}}
@media(max-width:760px){.life{grid-template-columns:1fr}.sb{position:static;max-height:none}}
.choice{border:2px solid var(--ink);background:var(--card);padding:16px 18px;margin-bottom:14px;box-shadow:0 5px 0 rgba(0,0,0,.08);animation:pop .25s}
@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.choice .q{font-size:13px;color:var(--red);font-weight:700;letter-spacing:.12em}
.choice .tx{font-size:18px;margin:6px 0 12px;line-height:1.75}
.choice img.who{float:right;width:96px;height:96px;object-fit:contain;margin:0 0 6px 12px;background:var(--paper);border:1px solid var(--line)}
.choice button{clear:both}
.choice button{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 14px;background:var(--paper);border:1px solid var(--line);font-size:16.5px}
.choice button:hover{background:var(--ink);color:var(--paper)}
.choice button em{font-style:normal;font-size:13.5px;color:var(--ink3);margin-left:8px}
.choice button:hover em{color:#e9d9b5}
.yc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);padding:12px 18px;margin:0 0 10px}
.yc.now{border-left-color:var(--ink)}
.yc.hot{border-left-color:var(--red)}
.yc .hd{font-size:14px;color:var(--ink2);margin-bottom:4px;display:flex;justify-content:space-between;gap:10px}
.yc .hd b{color:var(--ink);font-size:17px;margin-right:8px}
.yc p{margin:3px 0;font-size:16.5px}
.yc .mo{display:inline-block;min-width:34px;font-size:12.5px;color:var(--ink3)}
.quiet{font-size:14px;color:var(--ink3);margin:0 0 10px 8px}
.l-big{font-weight:700}
.l-realm{font-weight:900;color:var(--red);font-size:18px}
.l-art{color:var(--blue)}
.l-ok{color:var(--jade)}
.l-ng{color:var(--red)}
.l-pick{color:var(--ink2);font-size:15px}
.l-world{color:var(--ink3);font-size:15px}
.l-path{font-weight:700}
.l-thread{color:var(--gold);font-weight:700}
.l-rumor{color:#7a4f9a;font-weight:600}
.l-act{color:var(--ink);font-weight:700;border-left:3px solid var(--gold);padding-left:8px}
.l-muted{color:var(--ink3);font-size:14.5px}
.sb .tabs button{padding:6px 9px;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tabs button{border:0;background:transparent;padding:7px 12px;font-size:15px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.tabbody{background:var(--card);border:1px solid var(--line);border-top:0;padding:12px 14px}
.kv{display:grid;grid-template-columns:70px 1fr;gap:3px 10px;font-size:15px}
.kv span{color:var(--ink2)}
.art{padding:6px 0;border-bottom:1px dotted var(--line)}
.art .nm{font-weight:700}
.art .gr{font-size:12px;padding:0 6px;margin-left:6px;border:1px solid var(--line)}
.art .sg{float:right;font-size:13.5px;color:var(--ink2)}
.art.main .nm{color:var(--red)}
.bar{height:7px;background:#e3d6b8;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--jade)}
.br{display:grid;grid-template-columns:40px 1fr 44px;gap:8px;align-items:center;font-size:14.5px;margin:4px 0}
.br .v{text-align:right;color:var(--ink2);font-size:13px}
.st18{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 10px;font-size:13px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:13.5px;padding:1px 8px;border:1px solid var(--line);background:var(--paper);cursor:help}
.chip.bad{border-color:var(--red2);color:var(--red)}
.chip.unk{border-style:dashed;color:var(--ink3)}
.chip.t중품{border-color:var(--jade);color:var(--jade);font-weight:600}
.chip.t상품{background:var(--jade);color:#fff;border-color:var(--jade)}
.chip.t극품{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.chip.t천품{background:var(--red);color:#fff;border-color:var(--red);font-weight:900}
.bond{font-size:15px;padding:4px 0;border-bottom:1px dotted var(--line)}
.bond i{font-style:normal;color:var(--ink3);font-size:13px;margin-left:6px}
#tip{position:fixed;z-index:100;max-width:300px;background:#1d1812;color:#fbf6ea;font-size:13.5px;line-height:1.55;padding:7px 10px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;display:none}
[data-tip]{cursor:help}
.feel{margin-top:6px;font-size:15px;color:var(--ink2)}
.pc{border:1px solid var(--line);border-left:4px solid #8b7e69;background:var(--paper);padding:7px 10px;margin:6px 0;cursor:pointer}
.pc:hover{background:#fff8ea}
.pch{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pch .rels{font-size:13px;font-weight:700}
.l-love{color:#b0456f;font-weight:600}
.l-bond{color:#4d6b2f}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{text-align:left;padding:8px 10px;border:1px solid var(--line);background:var(--paper);font-size:14.5px}
.acts button:hover:not([disabled]){background:var(--ink);color:var(--paper)}
.acts button[disabled]{opacity:.45;cursor:not-allowed}
.acts button small{display:block;font-size:12px;color:var(--ink3)}
.acts button.queued{border-color:var(--gold);background:#fff4d6}
.tomb{max-width:760px;margin:24px auto;border:3px double var(--ink);padding:26px 30px;background:var(--card)}
.tomb .top{display:flex;gap:20px;align-items:center}
.tomb .top img{height:180px}
.tomb .gr{font-size:58px;font-weight:900;line-height:1}
.tomb .en{font-size:26px;font-weight:900;margin:4px 0}
.tomb .bio{font-size:16.5px;margin:16px 0;line-height:1.85}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">

<section id="intro">
  <span class="seal">江湖千萬分之一</span>
  <h1>강호 천만 분의 일<small>단 한 번의 무림 일생</small></h1>
  <p class="muted" style="max-width:760px;font-size:16px">강호에서는 오늘도 아이가 태어난다. 대부분은 논밭에서 나고 논밭에서 죽는다. 무공을 배우는 자는 몇 안 되고, 절정에 이르면 고수 대접을 받는다. 당신은 갈림길에서 고르고, 한 해를 어떻게 보낼지 정하고, 때로 스스로 길을 낸다. 지난 생들은 강호의 이야기로 남는다.</p>
  <p><button class="btn" id="startBtn">태어나기</button>
     <label class="muted" style="margin-left:12px"><input type="checkbox" id="autoStart"> 갈림길도 운명에 맡기기</label></p>
  <div class="grid2">
    <div class="box"><h3>이번 생에 켤 것 <span class="muted" id="unlCount"></span></h3><div id="unlocks"></div></div>
    <div class="box"><h3>강호 연대기 · 지난 생들</h3><div class="chron" id="chron"></div></div>
  </div>
  <h2>엔딩 <span class="muted" id="endCount"></span></h2>
  <div class="tags" id="endBoard"></div>
  <h2>업적 <span class="muted" id="achCount"></span></h2>
  <div class="tags" id="achBoard"></div>
</section>

<section id="lifeScreen" class="hidden">
  <div class="life">
    <aside class="sb" id="hero">
      <div class="sbtop">
        <div class="pt"><img id="portrait" alt=""></div>
        <div class="who">
          <div class="hn" id="hName"></div>
          <div class="hsub" id="hSub"></div>
          <div class="hsub birth" id="hBirth"></div>
          <div class="items" id="hItems"></div>
        </div>
      </div>
      <div class="hchips" id="hChips"></div>
      <div class="ctrl">
        <label class="muted">방침 <select id="plan"></select></label>
        <button class="btn sm ghost" id="pauseBtn">멈춤</button>
        <button class="btn sm ghost spd on" data-s="1">1배</button>
        <button class="btn sm ghost spd" data-s="3">3배</button>
        <button class="btn sm ghost spd" data-s="10">10배</button>
        <label class="muted"><input type="checkbox" id="autoChk"> 운명에 맡기기</label>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="tabbody" id="tabbody"></div>
    </aside>
    <main>
      <div id="choice" class="choice hidden"></div>
      <div id="log"></div>
    </main>
  </div>
</section>

<section id="endScreen" class="hidden">
  <div class="tomb">
    <div class="top"><img id="eImg" alt=""><div><div class="gr" id="eGrade"></div><div class="en" id="eName"></div><div id="eWho" class="muted" style="font-size:16px"></div></div></div>
    <div class="bio" id="eBio"></div>
    <h3>이번 생의 업적</h3><div class="tags" id="eAch"></div>
    <p id="eUnl" class="muted" style="margin-top:12px"></p>
    <p style="text-align:center;margin-top:18px"><button class="btn" id="againBtn">다음 생으로</button></p>
  </div>
</section>
</div>

<script>
const L = LIFE; L.init();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const R = L.REALMS, GORDER = ['神', '天', '地', '玄', '黃'];
const yr = y => (y < 0 ? '기원전 ' + -y : y) + '년';

// ---------- 기록 ----------
const KEY = 'gangho_v3';
const old = JSON.parse(localStorage.getItem('gangho_v2') || '{}');
const rec = Object.assign({ lives: 0, endings: {}, achs: {}, origins: [], traits: [], legends: [], on: {}, pick: {} }, old.endings ? { lives: old.lives || 0, endings: old.endings, achs: old.achs || {}, origins: old.origins || [], traits: old.traits || [] } : {}, JSON.parse(localStorage.getItem(KEY) || '{}'));
const save = () => localStorage.setItem(KEY, JSON.stringify(rec));
const endCount = () => Object.values(rec.endings).reduce((a, e) => a + e.c, 0);
const endKinds = g => Object.values(rec.endings).filter(e => !g || g.includes(e.g)).length;
const has = n => !!rec.achs[n];

// ---------- 해금(켜고 끄기, 10단계 9-10) ----------
const CH = [[-500, -222, '검의 시대'], [-221, 219, '제국과 유협'], [220, 588, '산문의 시작'], [589, 906, '승병과 이교'], [907, 1126, '문파의 태동'], [1127, 1278, '구파 정립'], [1279, 1367, '명교와 홍건'], [1368, 1449, '마교의 굴기'], [1450, 1549, '강호의 전성기'], [1550, 1643, '왜구와 동영'], [1644, 1779, '반청'], [1780, 1840, '황혼']];
const UNLOCKS = [
  { id: 'bestOf4', n: '좋은 그릇', d: '자질이 대체로 좋게 나온다', open: () => endKinds(['黃']) >= 5, why: '평범하게 끝난 삶을 다섯 갈래 겪으면 열린다' },
  { id: 'reveal', n: '제 몸을 안다', d: '타고난 특성을 처음부터 안다', open: () => endCount() >= 3, why: '세 번 살아 보면 열린다' },

const CAREER_B = { farm: 1, fisher: 3, hunter: 5, herb: 7, smith: 9, merchant: 11, cook: 13, craft: 15, artist: 17, troupe: 19, geomancer: 21, scholar: 22, military: 24, eunuch: 26, doctor: 27, thief: 29 };

// 그림의 성별: A는 번호, B는 짝홀(단독 생업 제외), C는 roster.json, F/N/M은 이름·데이터에서 읽는다

// 초상은 나이 단계(10·16·35·55세)가 바뀔 때만 다시 고른다. 그 사이에 소속·생업·재산·경지가 바뀌어도 얼굴은 그대로이고,

// 상대의 얼굴(사건·갈림길). 이름난 사람이면 그 사람 그림, 아니면 소속·역할·성별·나이로 고른다

    box.innerHTML = `<div class="q">${esc(q.ask)}${q.month ? ` · ${q.month}월` : ''}</div>${face ? `<img class="who" src="art/thumbs/${face}.webp" onerror="this.onerror=null;this.src='art/chars/${face}.png'" alt="">` : ''}<div class="tx">${q.text}</div>` + q.options.map((o, i) => `<button data-i="${i}">${esc(o[0])}${o[1] ? `<em>${esc(o[1])}</em>` : ''}</button>`).join('');
    const done = i => { box.classList.add('hidden'); choiceResolve = null; res(i); };
    choiceResolve = () => done(Math.floor(Math.random() * q.options.length));
    box.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => done(+b.dataset.i));
    // 이름 짓기(9-39): 직접 써 넣거나 아래 이름 가운데 고른다
    if (q.input) { const w = document.createElement('div'); w.className = 'nameIn'; w.innerHTML = '<input maxlength="12" placeholder="직접 이름을 쓴다"><button class="btn sm">이 이름으로</button>'; box.insertBefore(w, box.querySelector('button[data-i]')); const inp = w.querySelector('input'), go = () => { const v = inp.value.trim(); if (v) done(v); }; w.querySelector('button').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); }; }
    if (auto) setTimeout(() => choiceResolve && choiceResolve(), 900 / speed);
    window.scrollTo({ top: 0 });
  });
}
async function wait(ms) { let t = 0; while (t < ms || paused) { await sleep(40); if (!paused) t += 40 * speed; } }

async function live() {
  $('intro').classList.add('hidden'); $('endScreen').classList.add('hidden'); $('lifeScreen').classList.remove('hidden');
  $('log').innerHTML = '<p class="muted">세상이 흘러가는 중이다…</p>';
  auto = $('autoStart').checked; $('autoChk').checked = auto;
  await sleep(30);
  P = L.create(buildOpts()); P.auto = auto;
  const gen = L.run(P);
  let r = gen.next(), ticks = 0;
  renderAll();
  while (!r.done) {
    let ans;
    if (r.value && r.value.ask) { renderAll(); ans = await ask(r.value); }
    else if (r.value && r.value.tick === 'month') { if (++ticks % 2 === 0 || speed < 3) { renderHero(); renderLog(); renderTabs(); } await wait(P.age < 6 ? 40 : 110); }
    else if (r.value && r.value.tick === 'year') { renderAll(); await wait(120); }
    r = gen.next(ans);
  }
  renderAll();
  await wait(1200);
  ending(r.value);
}
function ending(e) {
  const before = UNLOCKS.filter(u => u.open()).map(u => u.id);
  const firstEnd = !rec.endings[e.name];
  const newA = [...P.ach].filter(a => !rec.achs[a]);
  rec.lives++;
  rec.endings[e.name] = { g: e.grade, c: (rec.endings[e.name] || { c: 0 }).c + 1 };
  for (const a of P.ach) rec.achs[a] = (rec.achs[a] || 0) + 1;
  if (!rec.origins.includes(P.origin.id)) rec.origins.push(P.origin.id);
  for (const t of P.traits) if (!L.MINOR_IDS.has(t.id) && !L.isHidden(P, t) && !rec.traits.includes(t.id)) rec.traits.push(t.id);
  rec.legends.push(L.legendOf(P)); if (rec.legends.length > 300) rec.legends.shift();
  rec.last = L.lastOf(P);
  save();
  const opened = UNLOCKS.filter(u => u.open() && !before.includes(u.id));
  $('lifeScreen').classList.add('hidden'); $('endScreen').classList.remove('hidden'); document.body.className = '';
  $('eImg').src = $('portrait').src;
  $('eGrade').innerHTML = `<span class="gt g${e.grade}" style="width:76px;height:76px;line-height:76px;font-size:50px;margin:0">${e.grade}</span>`;
  $('eName').textContent = e.name + (firstEnd ? ' · 처음 본 엔딩' : '');
  $('eWho').textContent = `${P.dharma || P.name}${P.epithet ? ` 「${P.epithet}」` : ''} · ${R[P.peak]} · ${yr(P.start.y)}~${yr(P.start.y + P.age)}`;
  $('eBio').textContent = L.summary(P);
  $('eAch').innerHTML = [...P.ach].map(a => `<span class="tag ${newA.includes(a) ? 'new' : ''}">${esc(a)}${newA.includes(a) ? ' · 처음' : ''}</span>`).join('') || '<span class="muted">없음</span>';
  $('eUnl').innerHTML = (opened.length ? `새로 열린 것: <b>${opened.map(u => u.n).join(', ')}</b>. ` : '') + '이 사람은 강호 연대기에 남았다. 다음 생에서 그의 이름이나 무덤, 세운 세력을 만날 수 있다.';
  window.scrollTo(0, 0);
}
$('againBtn').onclick = () => { $('endScreen').classList.add('hidden'); $('intro').classList.remove('hidden'); renderIntro(); window.scrollTo(0, 0); };
$('startBtn').onclick = live;
// 마우스를 올리자마자 설명이 뜬다(특성·기물·행동)
{ const tip = $('tip');
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (!el || !el.dataset.tip) { tip.style.display = 'none'; return; } tip.textContent = el.dataset.tip; tip.style.display = 'block'; });
  setInterval(() => { if (tip.style.display === 'block' && tip._x != null) { const el = document.elementFromPoint(tip._x, tip._y); const t = el && el.closest('[data-tip]'); if (!t) tip.style.display = 'none'; else tip.textContent = t.dataset.tip; } }, 300);
  document.addEventListener('mousemove', e => { tip._x = e.clientX; tip._y = e.clientY; if (tip.style.display !== 'block') return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 16; if (x + w > innerWidth - 8) x = e.clientX - w - 10; if (y + h > innerHeight - 8) y = e.clientY - h - 10; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });
  document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('[data-tip]') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]'))) tip.style.display = 'none'; }); }
renderIntro();
